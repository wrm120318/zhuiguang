<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 宣纸纤维噪点：极淡，几乎不可见 -->
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.03"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <!-- 细网格图案：极淡金色，学术感 -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#BA7517" stroke-opacity="0.04" stroke-width="0.5"/>
    </pattern>
    <!-- 斜向丝光：极淡白色高光 -->
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 细网格（透明叠加） -->
  <rect width="1440" height="1024" fill="url(#grid)"/>
  <!-- 斜向丝光 -->
  <rect width="1440" height="1024" fill="url(#silk)"/>
  <!-- 宣纸纤维噪点 -->
  <rect width="1440" height="1024" filter="url(#paper)" opacity="0.5"/>
</svg>
