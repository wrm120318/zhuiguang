<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 宣纸纤维噪点 -->
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <!-- 光斑柔化 -->
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <!-- 斜向丝光渐变 -->
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="22%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- 淡金光斑 -->
    <radialGradient id="goldA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8922E" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#C8922E" stop-opacity="0"/>
    </radialGradient>
    <!-- 基底暖米白 -->
    <linearGradient id="base" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#FAF8F4"/>
      <stop offset="55%" stop-color="#F5F1E8"/>
      <stop offset="100%" stop-color="#EFE9DC"/>
    </linearGradient>
    <!-- 细网格图案 -->
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0 L0 0 0 46" fill="none" stroke="#BA7517" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- 基底 -->
  <rect width="1440" height="1024" fill="url(#base)"/>
  <!-- 细网格 -->
  <rect width="1440" height="1024" fill="url(#grid)"/>
  <!-- 淡金光斑 -->
  <circle cx="180" cy="-40" r="460" fill="url(#goldA)" filter="url(#soft)"/>
  <circle cx="1320" cy="120" r="420" fill="url(#goldB)" filter="url(#soft)"/>
  <circle cx="980" cy="1040" r="380" fill="url(#goldA)" filter="url(#soft)"/>
  <!-- 斜向丝光 -->
  <rect width="1440" height="1024" fill="url(#silk)"/>
  <!-- 宣纸纤维噪点（叠加极低透明度） -->
  <rect width="1440" height="1024" filter="url(#paper)" opacity="0.7"/>
</svg>
