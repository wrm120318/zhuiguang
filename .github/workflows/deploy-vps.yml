# ===== 推送后自动通过 SSH 部署到 VPS =====
# 使用前置准备（在 GitHub 仓库的 Settings → Secrets and variables → Actions 中添加以下 Secrets）：
#   VPS_HOST        : 服务器公网 IP 或域名（例：1.2.3.4）
#   VPS_PORT        : SSH 端口（通常 22）
#   VPS_USER        : 登录用户（例：root）
#   VPS_SSH_KEY     : 私钥（id_rsa，需先把对应公钥加到服务器 ~/.ssh/authorized_keys）
#   VPS_APP_DIR     : 服务器上项目存放目录（例：/opt/zhuiguang；默认 /opt/zhuiguang）
name: Deploy to VPS
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build frontend
        run: npx vite build

      - name: 清理无用文件后压缩部署包（排除 node_modules、本地数据）
        run: |
          tar --exclude='node_modules' \
              --exclude='server/zhuiguang.db' \
              --exclude='server/zhuiguang.db-wal' \
              --exclude='server/zhuiguang.db-shm' \
              --exclude='server/uploads/*' \
              --exclude='.git' \
              --exclude='deploy.sh' \
              -czf deploy-package.tar.gz \
              dist server package.json package-lock.json .env.example .github .gitignore render.yaml
          ls -lh deploy-package.tar.gz

      - name: 上传部署包到 VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy-package.tar.gz"
          target: "/tmp"

      - name: 在 VPS 上解压、安装依赖、重启服务
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            [ -n "$APP_DIR" ] || APP_DIR="/opt/zhuiguang"

            echo "[1/6] 准备目录"
            sudo mkdir -p "$APP_DIR"
            sudo chown "$USER:$USER" "$APP_DIR"
            cd "$APP_DIR"

            # 备份当前数据（存在的话）
            if [ -f server/zhuiguang.db ]; then
              echo "[2/6] 备份数据库"
              mkdir -p /tmp/zhuiguang-backup
              cp -a server/zhuiguang.db server/zhuiguang.db-wal server/zhuiguang.db-shm /tmp/zhuiguang-backup/ 2>/dev/null || true
              cp -a server/uploads /tmp/zhuiguang-backup/ 2>/dev/null || true
            else
              echo "[2/6] 无历史数据库，跳过备份"
            fi

            echo "[3/6] 解压新代码"
            tar xzf /tmp/deploy-package.tar.gz -C "$APP_DIR"
            rm -f /tmp/deploy-package.tar.gz

            # 恢复数据库与上传文件（只在首次部署不覆盖）
            if [ -d /tmp/zhuiguang-backup ]; then
              echo "[4/6] 恢复历史数据（数据库+上传文件）"
              mkdir -p "$APP_DIR/server/uploads"
              cp -a /tmp/zhuiguang-backup/zhuiguang.db "$APP_DIR/server/" 2>/dev/null || true
              cp -a /tmp/zhuiguang-backup/zhuiguang.db-wal "$APP_DIR/server/" 2>/dev/null || true
              cp -a /tmp/zhuiguang-backup/zhuiguang.db-shm "$APP_DIR/server/" 2>/dev/null || true
              [ -d /tmp/zhuiguang-backup/uploads ] && cp -a /tmp/zhuiguang-backup/uploads/. "$APP_DIR/server/uploads/" || true
              rm -rf /tmp/zhuiguang-backup
            else
              echo "[4/6] 无历史数据需要恢复"
            fi

            echo "[5/6] 安装 Node 依赖"
            if [ -d node_modules ]; then
              npm ci --omit=dev --prefer-offline || npm install --omit=dev
            else
              npm install --omit=dev
            fi

            echo "[6/6] 重启服务（systemd 优先 → pm2 → nohup 兜底）"
            if command -v systemctl >/dev/null 2>&1 && systemctl list-unit-files --type=service 2>/dev/null | grep -q '^zhuiguang.service'; then
              sudo systemctl restart zhuiguang
              echo "✓ systemd 服务 zhuiguang 已重启"
            elif command -v pm2 >/dev/null 2>&1; then
              pm2 restart zhuiguang 2>/dev/null || pm2 start --name zhuiguang npm -- run start
              echo "✓ pm2 服务已重启"
            else
              pkill -f "tsx server/index.ts" 2>/dev/null || true
              nohup npm run start > app.log 2>&1 &
              echo "✓ 已用 nohup 后台启动（日志在 $APP_DIR/app.log）；建议改用 systemd 或 pm2 管理"
            fi

            sleep 3
            if curl -fsS -m 5 http://127.0.0.1:3001/ >/dev/null; then
              echo "✓ 服务健康检查通过（3001 返回 HTTP 200）"
            else
              echo "⚠ 健康检查失败，请登录服务器查看：cd $APP_DIR && tail -50 app.log 或 journalctl -u zhuiguang -n 50"
            fi
