# ===== 推送或合并 PR 时自动做类型检查 + 构建验证 =====
name: Build Check
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Build frontend
        run: npx vite build
