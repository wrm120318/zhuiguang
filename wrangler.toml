# ============================================================
# 🚀 追光学科共享平台 · Cloudflare Workers + Pages 配置（D1 + Pages）
# ============================================================
# 部署命令:
#   后端 Worker:  npx wrangler deploy
#   Pages:       通过 GitHub 自动部署（git push → Cloudflare Pages 自动构建）
#
# D1数据库创建:
#   npx wrangler d1 create zhuiguang-db
#   → 把返回的 database_id 填到下面 d1_databases.database_id
# ============================================================

name = "zhuiguang-api"
main = "worker-api.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
nodejs_compat = true

[alias]
"hono" = "./node_modules/hono/dist/index.js"
"jsonwebtoken" = "./node_modules/jsonwebtoken/index.js"
"bcryptjs" = "./node_modules/bcryptjs/index.js"
"@supabase/supabase-js" = "./node_modules/@supabase/supabase-js/dist/index.cjs"
"xlsx" = "./node_modules/xlsx/dist/xlsx.full.min.js"

# ====== D1 数据库 binding ======
[[d1_databases]]
binding = "DB"
database_name = "zhuiguang-db"
database_id = "996ab327-1a44-47fb-ac1d-5ab963dd04a5"

# ====== 环境变量（在Cloudflare Dashboard或这里配置） ======
