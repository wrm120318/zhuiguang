# ====== Pages 配置 ======
# Pages 通过 GitHub 自动部署，无需手动构建
# Pages Functions 位于 pages/ 目录，自动生效

# ====== 自定义路由（绑定xkzg.dpdns.org用） ======
# 方式1: Workers自定义域名 (推荐)
# 在Cloudflare Dashboard → Workers → 你的Worker → Settings → Triggers → Custom Domains
# 添加 api.xkzg.dpdns.org（或直接用 xkzg.dpdns.org 如果前端单独部署Pages）

# 方式2: 通过routes（需要域名在Cloudflare托管）
# routes = [
#   { pattern = "api.xkzg.dpdns.org/*", zone_name = "xkzg.dpdns.org" }
# ]
