# ============================================================
# 🚀 追光学科共享平台 · Cloudflare Workers 配置（D1 + Pages）
# ============================================================
# 部署命令:
#   npx wrangler deploy
#
# D1数据库创建:
#   npx wrangler d1 create zhuiguang-db
#   → 把返回的 database_id 填到下面 d1_databases.database_id
# ============================================================

