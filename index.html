<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 报告 §8.2 favicon 现代化：透明底「追光」母题（光晕+追光弧+光核+光斑），
         默认经典暖橙档；theme.ts 就绪后按 designMode 切换为墨金金调（id=zg-favicon）。 -->
    <link rel="icon" id="zg-favicon" type="image/svg+xml" href="/favicon-classic.svg" />
    <link rel="apple-touch-icon" id="zg-favicon-touch" href="/favicon-classic.svg" />
    <meta name="theme-color" id="zg-theme-color" content="#F59E0B" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <!-- 报告 §2.4-1 字体根治：自托管 Noto Serif SC 预载（零 CDN）。
         preload 让衬线在 HTML 解析阶段以最高优先级下载，首屏绘制前即就位，
         从而使 @font-face 的 font-display:swap 替补（通用 serif → 系统无衬线 CJK）永不显示，
         根治「早上好没衬线 / 用户名巨难看」的首屏无衬线闪屏。
         600 = 展示主字重（Hero 标题）；700 = 次级标题。800 保留字面但不预载（仅旧位偶用，避免首屏多拉 1.5MB）。 -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/noto-serif-sc-600.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/noto-serif-sc-700.woff2" />
    <title>追光 · 学科共享平台</title>
    <!-- ==========================================================================
         【v4.8.28-fix 主题零闪烁引导脚本】
         为什么必须放在这里（不能只靠 main.ts）：
           CSS 被解析后第一帧可能就已经绘制，此时 Vue 还没 mount、main.ts 也还没执行。
           若等到 Vue 起来再 applyTheme，用户会先看到 :root 的「经典暖橘」，
           再闪一下变成「墨金学术」——这就是主题闪烁。
           本脚本在 <head> 内**同步执行**，早于任何渲染，直接把皮肤变量写进
           documentElement 的内联样式 + 类名，首帧即正确。
         数据来源：localStorage['zg_theme_active']（由 theme store 在成功拉取后写入）。
         容错：try/catch 全包，任何异常都静默降级到 :root 默认皮肤，绝不影响页面加载。
         与 theme.ts 的 applyTheme() 保持同源逻辑（改一处必须同步改另一处）。
         ⚠️ 仅做「经典/墨金 + 色板 + 圆角/模糊」的最小必要集，其余交给 theme.ts 补齐。
         ========================================================================== -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('zg_theme_active')
          if (!raw) return
          var o = JSON.parse(raw)
          var c = o && o.config
          if (!c) return
          var r = document.documentElement
          var hexRgb = function (hex) {
            var m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim())
            if (!m) return null
            var n = parseInt(m[1], 16)
            return ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255)
          }
          var ink = c.designMode === 'inkgold'
          if (ink) {
            // 墨金：写 --zg-custom-* 供 .zg-inkgold 类规则读取；清掉直接值防经典残留击穿
            if (c.primary) r.style.setProperty('--zg-custom-primary', c.primary)
            if (c.primary2) r.style.setProperty('--zg-custom-primary-2', c.primary2)
            if (c.accent) r.style.setProperty('--zg-custom-accent', c.accent)
          } else {
            if (c.primary) r.style.setProperty('--zg-primary', c.primary)
            if (c.primary2) r.style.setProperty('--zg-primary-2', c.primary2)
            if (c.accent) r.style.setProperty('--zg-accent', c.accent)
            if (c.bgFrom) r.style.setProperty('--zg-bg-from', c.bgFrom)
            if (c.bgVia) r.style.setProperty('--zg-bg-via', c.bgVia)
            if (c.bgTo) r.style.setProperty('--zg-bg-to', c.bgTo)
            if (c.blur != null) r.style.setProperty('--zg-blur', c.blur + 'px')
            if (c.radius != null) r.style.setProperty('--zg-radius', c.radius + 'px')
          }
          var pr = hexRgb(c.primary), p2 = hexRgb(c.primary2), ac = hexRgb(c.accent)
          if (pr) r.style.setProperty('--zg-custom-primary-rgb', pr)
          if (p2) r.style.setProperty('--zg-custom-primary-2-rgb', p2)
          if (ac) r.style.setProperty('--zg-custom-accent-rgb', ac)
          if (!ink) {
            if (pr) r.style.setProperty('--zg-primary-rgb', pr)
            if (p2) r.style.setProperty('--zg-primary-2-rgb', p2)
            if (ac) r.style.setProperty('--zg-accent-rgb', ac)
          }
          r.classList.toggle('zg-inkgold', ink)
          r.classList.toggle('zg-inkgold-dark', ink && (c.inkgoldTone || 'light') === 'dark')
          r.classList.toggle('zg-inkgold-bright', ink && (c.bright || 'soft') === 'bright')
          // favicon / 地址栏配色跟随皮肤（与 theme.ts 的 applyFavicon 同源）
          var tone = (c.inkgoldTone || 'light') === 'dark' ? 'dark' : 'light'
          var href = ink ? '/favicon-inkgold.svg' : '/favicon-classic.svg'
          var f = document.getElementById('zg-favicon')
          var ft = document.getElementById('zg-favicon-touch')
          if (f) f.setAttribute('href', href)
          if (ft) ft.setAttribute('href', href)
          var tc = document.getElementById('zg-theme-color')
          if (tc && c.primary) tc.setAttribute('content', c.primary)
        } catch (e) { /* 缓存损坏/隐私模式：静默走 :root 默认皮肤 */ }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- macOS Liquid Glass 液态玻璃 SVG 滤镜（全局）
         参考: https://github.com/lucasromerodb/liquid-glass-effect-macos
         重要：滤镜只应用在空的效果层(::before)上，绝不能直接应用在内容容器上，
         否则会扭曲文字和图标！feDisplacementMap的scale必须极小(3-5)，只产生微妙的透镜折射感。 -->
    <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
      <defs>
        <!-- 镜面高光滤镜：feSpecularLighting模拟玻璃表面的光线反射
             不做位移扭曲(scale=0)，只增加高光质感，安全不扭曲内容 -->
        <filter id="zg-glass-specular" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox">
          <feTurbulence type="fractalNoise" baseFrequency="0.006 0.006" numOctaves="2" seed="7" result="noise"/>
          <feGaussianBlur in="noise" stdDeviation="6" result="softNoise"/>
          <feSpecularLighting in="softNoise" surfaceScale="2" specularConstant="0.4" specularExponent="80" lighting-color="white" result="specLight">
            <fePointLight x="-100" y="-200" z="200"/>
          </feSpecularLighting>
          <feComposite in="specLight" in2="SourceGraphic" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
        </filter>
        <!-- 微妙折射滤镜：极微scale(4)，只在空效果层使用，大尺度透镜弯曲感 -->
        <filter id="zg-glass-refract" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox">
          <feTurbulence type="fractalNoise" baseFrequency="0.005 0.005" numOctaves="1" seed="11" result="noise"/>
          <feGaussianBlur in="noise" stdDeviation="8" result="softNoise"/>
          <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
    </svg>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
