# ===== Render.com 一键部署配置（Turso + Supabase 版） =====
# 使用方法：登录 https://dashboard.render.com → New → Web Service → Connect GitHub 仓库，Render 会自动识别本文件
# 注意：本版本数据/文件均存在外部免费服务（Turso + Supabase），不依赖 Render 持久盘
#        所以可以放心用 Free 实例（每 15 分钟空闲冷启动，运行时免费）

services:
  - type: web
    name: zhuiguang
    runtime: node
    region: singapore  # 可选：oregon / frankfurt / singapore / ohio / virginia / tokyo / sydney / mumbai
    plan: free  # 免费实例（无持久盘也无所谓，数据全在 Turso/Supabase）
    numInstances: 1
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      # —— 应用基础 ——
      - key: JWT_SECRET
        generateValue: true  # 让 Render 自动生成随机密钥
      - key: JWT_EXPIRES
        value: 7d
      # —— Turso 数据库（在 Render 控制台手动填入你的 Turso 凭据）——
      - key: TURSO_DATABASE_URL
        sync: false  # 标记为需手动填写，Render 不会自动生成
      - key: TURSO_AUTH_TOKEN
        sync: false
      # —— Supabase 文件存储（在 Render 控制台手动填入）——
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: zhuiguang-files
    autoDeploy: yes
